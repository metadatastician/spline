name: Spline alignment
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  alignment:
    name: Authoritative Bebop alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: spline
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/groove
          # Reviewed implementation revision; update with counterpart acceptance.
          ref: 9a067b1195ca0b780e9f4370636b39479d99ec9d
          path: groove
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Run the authoritative checker and its rejection controls
        working-directory: spline
        run: bash tests/check_alignment.sh "$GITHUB_WORKSPACE/groove"
