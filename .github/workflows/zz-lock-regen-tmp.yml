# SPDX-License-Identifier: MPL-2.0
# TEMPORARY bootstrap workflow. It exists only because `gh actions-lock` is a
# release-binary gh extension and this change had to be produced in an
# environment that cannot download GitHub release assets. It regenerates the
# lock with the official tool ON A HOSTED RUNNER, then deletes itself in the
# same commit so it never reaches the pull request.
name: "Lock regen (temporary)"
on:
  push:
    branches: [arena/d3e8caaa-spline]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lock-regen-tmp
  cancel-in-progress: false
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/d3e8caaa-spline
          fetch-depth: 0

      - name: Install the official lock tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.1.6

      - name: Record the pre-existing verification result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "== gh actions-lock --verify-local (BEFORE) =="
            gh actions-lock --verify-local 2>&1 || echo "[exit $?]"
          } | tee lock-regen-report.txt

      - name: Remove this temporary workflow so it is not locked
        run: git rm --quiet .github/workflows/zz-lock-regen-tmp.yml

      - name: Regenerate actions.lock with the official tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "== gh actions-lock --no-migrate-local-actions --no-narrow =="
            gh actions-lock --no-migrate-local-actions --no-narrow 2>&1
            echo "[exit $?]"
          } | tee -a lock-regen-report.txt

      - name: Verify the regenerated lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo
            echo "== gh actions-lock --verify-local (AFTER) =="
            gh actions-lock --verify-local 2>&1
            echo "[verify exit $?]"
            echo
            echo "== git status =="
            git status --short
            echo
            echo "== lock heads =="
            head -20 .github/workflows/actions.lock
            echo
            echo "== scorecard entry =="
            grep -n -A3 "scorecard.yml" .github/workflows/actions.lock
            echo
            echo "== scanner pin entry =="
            grep -n -A5 "b8f60511e76c9015d86990317162dce653c92fe1" .github/workflows/actions.lock
          } 2>&1 | tee -a lock-regen-report.txt
          true

      - name: Commit and push the results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ci): regenerate actions.lock with official gh actions-lock v0.1.6" \
                     -m "Machine-generated by gh actions-lock v0.1.6 on a hosted runner; see lock-regen-report.txt in this commit for the before/after verification output."
          git push origin HEAD:arena/d3e8caaa-spline
