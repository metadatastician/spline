# SPDX-License-Identifier: MPL-2.0
# TEMPORARY bootstrap workflow. It exists only because `gh actions-lock` is a
# release-binary gh extension and this change had to be produced in an
# environment that cannot download GitHub release assets. It runs the official
# tool ON A HOSTED RUNNER and publishes the generated lockfile as a pull-request
# comment (a commit cannot carry it: GITHUB_TOKEN has no `workflows` permission,
# so any bot push that deletes this file is refused). The lock is then committed
# from a normal checkout, in the same commit that deletes this file.
name: "Lock regen (temporary)"
on:
  push:
    branches: [arena/d3e8caaa-spline]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: lock-regen-tmp
  cancel-in-progress: false
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/d3e8caaa-spline
          fetch-depth: 0

      - name: Install the official lock tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Record the pre-existing verification result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "== gh actions-lock --verify-local (BEFORE) =="
            gh actions-lock --verify-local 2>&1 || echo "[exit $?]"
          } | tee report.txt

      - name: Remove this temporary workflow so it is not locked
        run: git rm --quiet .github/workflows/zz-lock-regen-tmp.yml

      - name: Regenerate actions.lock with the official tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "== gh actions-lock --no-migrate-local-actions --no-narrow =="
            gh actions-lock --no-migrate-local-actions --no-narrow 2>&1 || echo "[exit $?]"
            echo
            echo "== git status =="
            git status --short
            echo
            echo "== lock head =="
            sed -n '1,40p' .github/workflows/actions.lock
          } | tee -a report.txt

      - name: Verify the regenerated lock
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo
            echo "== gh actions-lock --verify-local (AFTER) =="
            gh actions-lock --verify-local 2>&1
            echo "[verify exit $?]"
          } | tee -a report.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish the report and the generated lock as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(gh pr list --head arena/d3e8caaa-spline --state open --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            echo "::error::no open pull request for arena/d3e8caaa-spline"
            exit 1
          fi
          {
            echo "<!-- lock-regen-report -->"
            echo "### gh actions-lock run"
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "lock sha256: $(sha256sum .github/workflows/actions.lock | cut -d' ' -f1)"
            echo
            echo "actions.lock (base64, single line):"
            echo
            base64 -w0 .github/workflows/actions.lock
          } > comment.md
          gh pr comment "$n" --body-file comment.md

      - name: Fail the job if the regenerated lock did not verify
        if: steps.verify.outputs.rc != '0'
        run: |
          echo "::error::gh actions-lock --verify-local did not pass after regeneration"
          exit 1
