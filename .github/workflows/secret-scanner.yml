# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# THE PIN
# -------
# The reusable is pinned to a FULL commit SHA, never a tag or branch: a tag can
# be moved, so it cannot be verified.
#
#   b8f60511e76c9015d86990317162dce653c92fe1
#
# is a commit on metadatastician/standards' main branch and is RUNTIME
# VALIDATED, which is the only property that makes a pin safe to use: this
# repository's own runs at that SHA created all three scanner jobs and reported
#   scan / gitleaks      success
#   scan / rust-secrets  success
#   scan / shell-secrets success
# (runs 42369205833 on PR #53 and 42369472567 on main, 2026-11-07). It is the
# same revision the estate's other callers (groove, svalinn) run.
# Do not bump this to `main` or to an arbitrary newer commit: re-pin only to a
# revision some caller has actually run, and regenerate actions.lock in the
# same change.
#
# NO `secrets:` LINE, DELIBERATELY
# --------------------------------
# `secrets: inherit` is NOT required and must not be added back. The reusable
# declares no `workflow_call.secrets` and references no `secrets.*`: gitleaks
# runs as a pinned, checksum-verified binary and the GITHUB_TOKEN each job acts
# under is governed by `permissions:`. Forwarding every repository and
# organisation secret to a scanner that needs none is CWE-250 (standards#1108
# §6b). An earlier version of this header said the opposite; that guidance died
# with the action-based gitleaks job and kept propagating into generated
# callers.
name: "Secret Scanner"
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # `contents: read` is the complete grant the reusable needs. This job-level
    # block REPLACES the workflow-level one rather than merging with it, so
    # this line — not the block above — is what the called workflow is measured
    # against. A called workflow cannot exceed its caller's job-level grant, and
    # a rejected run creates NO check run at all, which is an outage that looks
    # like silence rather than red.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
